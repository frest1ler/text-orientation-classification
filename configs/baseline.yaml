experiment:
  name: mobilenet_v3_large_384x96
  seed: 42
  output_dir: artifacts/experiments

data:
  test_zip: test.zip
  image_prefix: test/images/
  sample_submission_member: sample_submission.csv
  num_workers: 2

synthetic:
  train_samples: 50000
  validation_samples: 5000
  languages: [ru, en, digits, mixed]
  validation_font_fraction: 0.2

model:
  name: mobilenet_v3_large
  pretrained: true
  input_height: 96
  input_width: 384
  dropout: 0.2

training:
  batch_size: 64
  frozen_epochs: 2
  finetune_epochs: 8
  frozen_learning_rate: 0.001
  finetune_learning_rate: 0.0001
  weight_decay: 0.0001
  amp: true
  deterministic: true
  symmetry_loss_weight: 0.0

validation:
  primary_metric: brier_score
  early_stopping_patience: 3

inference:
  batch_size: 128
  symmetric_tta: false
  temperature: 1.0
